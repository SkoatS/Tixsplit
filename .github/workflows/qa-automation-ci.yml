name: QA Test Automation CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Pilih Test Suite untuk dieksekusi'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'api'
          - 'ui-regression'
          - 'cross-browser'
      environment:
        description: 'Target Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - 'staging'

jobs:
  # ============================================================================
  # 1. Fast API Regression Suite (< 15 seconds)
  # ============================================================================
  api-regression:
    name: ⚡ REST API Regression Tests
    runs-on: ubuntu-latest
    if: github.event.inputs.test_suite == 'all' || github.event.inputs.test_suite == 'api' || github.event_name != 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run REST API Test Suite
        env:
          ENV: ${{ github.event.inputs.environment || 'staging' }}
        run: |
          ./gradlew test -PsuiteFile=src/test/resources/testng-api.xml -Denv=$ENV --no-daemon

      - name: Upload API Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: build/reports/tests/test/
          retention-days: 7

  # ============================================================================
  # 2. Full E2E UI & Concurrency Regression Suite
  # ============================================================================
  ui-regression:
    name: 🌐 Full E2E UI & Concurrency Tests
    runs-on: ubuntu-latest
    needs: [ api-regression ]
    if: always() && (github.event.inputs.test_suite == 'all' || github.event.inputs.test_suite == 'ui-regression' || github.event_name != 'workflow_dispatch')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Full E2E Regression Suite
        env:
          ENV: ${{ github.event.inputs.environment || 'staging' }}
          GITHUB_ACTIONS: "true"
        run: |
          ./gradlew test -PsuiteFile=src/test/resources/testng.xml -Dheadless=true -Denv=$ENV --no-daemon

      - name: Upload UI Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-report
          path: build/reports/tests/test/
          retention-days: 7

  # ============================================================================
  # 3. Cross-Browser Smoke Tests (Chrome & Firefox)
  # ============================================================================
  cross-browser-smoke:
    name: 🦊 Cross-Browser Smoke Tests (Chrome + Firefox)
    runs-on: ubuntu-latest
    needs: [ api-regression ]
    if: always() && (github.event.inputs.test_suite == 'all' || github.event.inputs.test_suite == 'cross-browser' || github.event_name != 'workflow_dispatch')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Setup Firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Cross-Browser Smoke Suite
        env:
          ENV: ${{ github.event.inputs.environment || 'staging' }}
          GITHUB_ACTIONS: "true"
        run: |
          ./gradlew test -PsuiteFile=src/test/resources/testng-crossbrowser-smoke.xml -Dheadless=true -Denv=$ENV --no-daemon

      - name: Upload Cross-Browser Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-browser-test-report
          path: build/reports/tests/test/
          retention-days: 7
